name: Replace Munich hero with summer media

on:
  push:
    branches:
      - fix/walking-hero-size

permissions:
  contents: write

jobs:
  ingest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/walking-hero-size
          fetch-depth: 0

      - name: Install media tooling
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check pillow

      - name: Download summer Marienplatz source
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            "https://videos.pexels.com/video-files/37585740/15928823_2160_3840_30fps.mp4" \
            -o /tmp/munich-summer-source.mp4
          test -s /tmp/munich-summer-source.mp4

      - name: Build fixed-frame web hero
        shell: bash
        run: |
          ffmpeg -y -ss 1 -t 8 -i /tmp/munich-summer-source.mp4 \
            -an \
            -vf "scale=1280:-2,crop=1280:720:0:(in_h-720)/2" \
            -c:v libx264 -preset medium -crf 23 -pix_fmt yuv420p -movflags +faststart \
            public/videos/munich-altstadt-hero.mp4

          ffmpeg -y -ss 4 -i /tmp/munich-summer-source.mp4 -frames:v 1 \
            -vf "scale=1280:-2,crop=1280:720:0:(in_h-720)/2" \
            -c:v libwebp -quality 86 \
            public/images/munich-altstadt-hero-poster.webp

          test -s public/videos/munich-altstadt-hero.mp4
          test -s public/images/munich-altstadt-hero-poster.webp

      - name: Reject effectively monochrome poster
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageStat
          path = "public/images/munich-altstadt-hero-poster.webp"
          image = Image.open(path).convert("HSV")
          saturation = ImageStat.Stat(image).mean[1] / 255
          print(f"mean_saturation={saturation:.4f}")
          if saturation < 0.10:
              raise SystemExit("Hero poster is effectively monochrome; rejecting asset.")
          PY

      - name: Commit replacement media
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/munich-altstadt-hero.mp4 public/images/munich-altstadt-hero-poster.webp
          git commit -m "feat: use summer Marienplatz hero media"
          git fetch origin fix/walking-hero-size
          git rebase origin/fix/walking-hero-size
          git push origin HEAD:fix/walking-hero-size

name: paris spike visual qa

on:
  push:
    branches: [feat/paris-immersive-spike]

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build
        run: |
          npm install
          npm run build

      - name: Install browser driver client
        run: pip install selenium

      - name: Start static server
        run: |
          python3 -m http.server 4321 --directory dist >/tmp/paris-spike-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4321/guides/paris-kunst-4-tage/ >/dev/null

      - name: Capture and validate
        run: |
          mkdir -p visual-qa
          python3 - <<'PY'
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          root = "http://127.0.0.1:4321/guides/paris-kunst-4-tage/"
          out = Path("visual-qa")

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--hide-scrollbars")
          driver = webdriver.Chrome(options=options)

          def prepare(width, height):
              driver.set_window_size(width, height)
              driver.get(root)
              driver.execute_script(
                  "localStorage.setItem('reiseauswahl-consent-v1', JSON.stringify({analytics:false,marketing:false}));"
              )
              driver.refresh()
              time.sleep(1.8)

          def assert_no_overflow(label):
              overflow = driver.execute_script(
                  "return document.documentElement.scrollWidth > document.documentElement.clientWidth + 1"
              )
              if overflow:
                  raise AssertionError(f"horizontal overflow: {label}")

          def shot(width, height, suffix):
              prepare(width, height)
              assert_no_overflow(f"{suffix}-{width}")
              driver.save_screenshot(str(out / f"{suffix}-{width}.png"))

              stage = driver.find_element("css selector", "[data-paris-map]")
              driver.execute_script("arguments[0].scrollIntoView({block:'center'});", stage)
              time.sleep(4)
              map_ready = driver.execute_script(
                  "return Boolean(document.querySelector('[data-paris-map] .maplibregl-canvas'))"
              )
              if not map_ready:
                  raise AssertionError(f"interactive map did not initialize: {width}px")
              assert_no_overflow(f"story-{width}")
              driver.save_screenshot(str(out / f"story-{width}.png"))

          shot(1440, 1200, "hero")
          shot(390, 844, "hero")

          driver.execute_cdp_cmd("Emulation.setEmulatedMedia", {
              "features": [{"name": "prefers-reduced-motion", "value": "reduce"}]
          })
          prepare(390, 844)
          reduced = driver.execute_script(
              "return window.matchMedia('(prefers-reduced-motion: reduce)').matches"
          )
          if not reduced:
              raise AssertionError("reduced-motion media emulation failed")
          driver.find_element("css selector", "[data-paris-map]")
          assert_no_overflow("reduced-motion-390")
          driver.save_screenshot(str(out / "reduced-motion-390.png"))

          driver.quit()
          print("Visual QA passed")
          PY

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: paris-spike-visual-qa
          path: visual-qa/*.png
          retention-days: 7

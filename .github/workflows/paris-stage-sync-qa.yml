name: paris stage synchronization qa

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          npm install
          npm run build

      - name: Install browser client
        run: pip install selenium

      - name: Start static server
        run: |
          python3 -m http.server 4321 --directory dist >/tmp/server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4321/guides/paris-kunst-4-tage/ >/dev/null

      - name: Validate synchronized stage states
        run: |
          python3 - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          url = "http://127.0.0.1:4321/guides/paris-kunst-4-tage/"
          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          driver = webdriver.Chrome(options=options)
          driver.set_window_size(1440, 1200)
          driver.get(url)
          driver.execute_script(
              "localStorage.setItem('reiseauswahl-consent-v1', JSON.stringify({analytics:false,marketing:false}));"
          )
          driver.refresh()
          time.sleep(2.5)

          map_el = driver.find_element("css selector", "[data-paris-map]")
          driver.execute_script("arguments[0].scrollIntoView({block:'center'});", map_el)
          time.sleep(4)
          if not driver.execute_script("return Boolean(document.querySelector('[data-paris-map] .maplibregl-canvas'))"):
              raise AssertionError("MapLibre canvas missing")

          def heading_contains(text):
              return driver.execute_script("""
                return [...document.querySelectorAll('[data-paris-story-copy] h2')]
                  .find((el) => (el.textContent || '').includes(arguments[0])) || null;
              """, text)

          def marker_center(key):
              return driver.execute_script("""
                const el=document.querySelector('[data-poi-key="' + arguments[0] + '"]');
                const r=el.getBoundingClientRect();
                return {x:r.left+r.width/2,y:r.top+r.height/2};
              """, key)

          def core_visible():
              return driver.execute_script("""
                const map=document.querySelector('[data-paris-map]').getBoundingClientRect();
                return ['orsay','louvre','orangerie'].every((key)=>{
                  const el=document.querySelector('[data-poi-key="'+key+'"]');
                  const r=el.getBoundingClientRect();
                  const x=r.left+r.width/2, y=r.top+r.height/2;
                  return x>=map.left && x<=map.right && y>=map.top && y<=map.bottom;
                });
              """)

          def assert_stage(heading, state, media, title, active_marker=None, route=None):
              el=heading_contains(heading)
              driver.execute_script("arguments[0].scrollIntoView({block:'center'});", el)
              time.sleep(1.15)

              actual_state=driver.find_element("css selector", "[data-paris-experience]").get_attribute("data-active-stage")
              actual_media=driver.find_element("css selector", "[data-media].is-active").get_attribute("data-media")
              actual_title=driver.find_element("css selector", "[data-decision-title]").text.strip()
              if (actual_state, actual_media, actual_title)!=(state, media, title):
                  raise AssertionError(
                    f"{heading}: expected {(state,media,title)}, got {(actual_state,actual_media,actual_title)}"
                  )

              if route is not None:
                  actual_route=driver.find_element("css selector", "[data-paris-map]").get_attribute("data-route-progress")
                  if actual_route != str(route):
                      raise AssertionError(f"{heading}: route {actual_route} != {route}")

              active=driver.find_elements("css selector", ".paris-map-marker.is-active")
              active_key=active[0].get_attribute("data-poi-key") if active else None
              if active_key != active_marker:
                  raise AssertionError(f"{heading}: active marker {active_key!r} != {active_marker!r}")

              if state in ("orsay","louvre","orangerie","plan","overview") and not core_visible():
                  raise AssertionError(f"{heading}: core route lost from viewport")

          positions={}
          assert_stage("Musée d'Orsay", "orsay", "orsay", "Musée d'Orsay", "orsay", 0)
          positions["orsay"]=marker_center("louvre")

          assert_stage("Louvre:", "louvre", "louvre", "Louvre", "louvre", 1)
          positions["louvre"]=marker_center("louvre")
          if not driver.find_element("css selector", '[data-poi-key="orsay"]').get_attribute("class").find("is-completed") >= 0:
              raise AssertionError("Orsay not marked completed at Louvre")

          assert_stage("Orangerie:", "orangerie", "orangerie", "Musée de l'Orangerie", "orangerie", 2)
          positions["orangerie"]=marker_center("louvre")

          # Camera should move visibly between the three focused states, without losing the core route.
          if abs(positions["orsay"]["x"] - positions["louvre"]["x"]) < 18:
              raise AssertionError(f"Orsay/Louvre camera emphasis too similar: {positions}")
          if abs(positions["louvre"]["x"] - positions["orangerie"]["x"]) < 10 and abs(positions["louvre"]["y"] - positions["orangerie"]["y"]) < 10:
              raise AssertionError(f"Louvre/Orangerie camera emphasis too similar: {positions}")

          assert_stage(
              "So würden wir vier Tage tatsächlich aufbauen",
              "plan", "overview", "Orsay → Louvre → Orangerie → Flex", None, "full"
          )
          assert_stage(
              "Wenn Monet dein Spezialinteresse ist",
              "marmottan", "marmottan", "Musée Marmottan Monet", "marmottan", "full"
          )
          assert_stage(
              "Plan B:",
              "flex", "paris", "Tag D hält die Reise beweglich", None, "full"
          )
          assert_stage(
              "Unsere Entscheidung in einem Satz",
              "final", "overview", "Drei Kunstanker. Ein Flex-Tag.", None, "full"
          )

          overflow=driver.execute_script(
              "return document.documentElement.scrollWidth > document.documentElement.clientWidth + 1"
          )
          if overflow:
              raise AssertionError("desktop horizontal overflow")

          driver.set_window_size(390, 844)
          driver.get(url)
          time.sleep(1.5)
          overflow=driver.execute_script(
              "return document.documentElement.scrollWidth > document.documentElement.clientWidth + 1"
          )
          if overflow:
              raise AssertionError("mobile horizontal overflow")

          driver.quit()
          print("Paris stage synchronization QA passed")
          PY

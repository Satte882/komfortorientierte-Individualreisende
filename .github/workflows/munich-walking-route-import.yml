name: import Munich walking route

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  import-route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/munich-walking-spike-v2

      - name: Generate one-time foot route
        run: bash scripts/import-munich-walking-route.sh

      - name: Commit local GeoJSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/routes/munich-old-town-walk.geojson
          if git diff --cached --quiet; then
            echo "Route unchanged"
            exit 0
          fi
          git commit -m "data: add local Munich walking route"
          git push origin HEAD:feat/munich-walking-spike-v2

name: Replace Munich hero media

on:
  push:
    branches:
      - fix/munich-cinematic-hero

permissions:
  contents: write

jobs:
  ingest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/munich-cinematic-hero
          fetch-depth: 0

      - name: Install media tooling
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check pillow

      - name: Download Pexels source
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            "https://videos.pexels.com/video-files/3863114/3863114-uhd_3840_2160_25fps.mp4" \
            -o /tmp/munich-source.mp4
          test -s /tmp/munich-source.mp4
          echo "SOURCE=/tmp/munich-source.mp4" >> "$GITHUB_ENV"

      - name: Build web hero video and poster
        shell: bash
        run: |
          ffmpeg -y -ss 2 -t 8 -i "$SOURCE" \
            -an \
            -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720" \
            -c:v libx264 -preset medium -crf 23 -pix_fmt yuv420p -movflags +faststart \
            public/videos/munich-altstadt-hero.mp4

          ffmpeg -y -ss 4 -i "$SOURCE" -frames:v 1 \
            -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720" \
            -c:v libwebp -quality 86 \
            public/images/munich-altstadt-hero-poster.webp

          test -s public/videos/munich-altstadt-hero.mp4
          test -s public/images/munich-altstadt-hero-poster.webp

      - name: Reject effectively monochrome poster
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageStat
          path = "public/images/munich-altstadt-hero-poster.webp"
          image = Image.open(path).convert("HSV")
          saturation = ImageStat.Stat(image).mean[1] / 255
          print(f"mean_saturation={saturation:.4f}")
          if saturation < 0.10:
              raise SystemExit("Hero poster is effectively monochrome; rejecting asset.")
          PY

      - name: Commit replacement media
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/munich-altstadt-hero.mp4 public/images/munich-altstadt-hero-poster.webp
          git commit -m "feat: replace Munich hero with color Marienplatz video"
          git fetch origin fix/munich-cinematic-hero
          git rebase origin/fix/munich-cinematic-hero
          git push origin HEAD:fix/munich-cinematic-hero

name: import marmottan media

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paris-stage-state-sync

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow
      - run: bash scripts/import-marmottan-media.sh

      - name: Commit localized image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/paris-spike/marmottan.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: localize licensed Marmottan media"
          git push origin HEAD:fix/paris-stage-state-sync

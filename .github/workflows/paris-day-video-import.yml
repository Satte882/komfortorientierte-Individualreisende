name: import replacement paris hero video

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  import-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/paris-final-polish

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Build local daytime hero clip
        run: bash scripts/import-paris-day-hero.sh

      - name: Commit replacement video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/paris-spike/paris-hero.mp4
          if git diff --cached --quiet; then
            echo "No video changes"
            exit 0
          fi
          git commit -m "chore: replace Paris hero with daytime Seine clip"
          git push origin HEAD:feat/paris-final-polish

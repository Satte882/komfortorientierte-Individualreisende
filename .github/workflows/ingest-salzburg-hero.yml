name: Ingest Salzburg hero media

on:
  push:
    branches:
      - fix/salzburg-authentic-video-publish
    paths:
      - .github/workflows/ingest-salzburg-hero.yml

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/salzburg-authentic-video-publish
      - name: Download authentic Salzburg footage
        run: |
          python -m pip install --quiet yt-dlp
          yt-dlp "https://pixabay.com/videos/salzburg-city-salzburg-mountains-132540/" -f "best[ext=mp4]/best" -o /tmp/salzburg-source.mp4
          test -s /tmp/salzburg-source.mp4
      - name: Optimize hero clip
        run: |
          ffmpeg -y -i /tmp/salzburg-source.mp4 -t 9 -vf "scale=1280:-2:force_original_aspect_ratio=decrease,crop=1280:720" -an -c:v libx264 -preset medium -crf 25 -movflags +faststart public/videos/salzburg-hero.mp4
          test -s public/videos/salzburg-hero.mp4
      - name: Commit authentic Salzburg asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/salzburg-hero.mp4
          git commit -m "media: replace Salzburg hero with authentic footage"
          git push origin HEAD:fix/salzburg-authentic-video-publish

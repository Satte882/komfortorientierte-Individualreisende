name: Ingest authentic Salzburg hero

on:
  push:
    branches: [main]
    paths: [.github/workflows/ingest-salzburg-hero.yml]

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/salzburg-authentic-video-publish
      - name: Download authentic Salzburg footage from Pixabay
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import html, re, requests
          from bs4 import BeautifulSoup
          page='https://pixabay.com/videos/salzburg-city-salzburg-mountains-132540/'
          text=requests.get(page,headers={'User-Agent':'Mozilla/5.0'},timeout=30).text
          soup=BeautifulSoup(text,'html.parser')
          candidates=[]
          for tag in soup.find_all('script'):
              raw=html.unescape(tag.string or tag.get_text() or '')
              candidates += re.findall(r'https://cdn\.pixabay\.com/[^"\\\\ ]+?\.mp4[^"\\\\ ]*', raw)
          candidates += re.findall(r'https://cdn\.pixabay\.com/[^"\\\\ ]+?\.mp4[^"\\\\ ]*', html.unescape(text))
          if not candidates: raise SystemExit('No Pixabay MP4 URL found')
          url=max(set(candidates), key=lambda u: len(u))
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0','Referer':page},timeout=60)
          r.raise_for_status()
          open('/tmp/salzburg-source.mp4','wb').write(r.content)
          PY
      - name: Optimize and commit
        run: |
          ffmpeg -y -i /tmp/salzburg-source.mp4 -t 9 -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720" -an -c:v libx264 -preset medium -crf 25 -movflags +faststart public/videos/salzburg-hero.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/salzburg-hero.mp4
          git commit -m "media: use authentic Salzburg city footage"
          git push origin HEAD:fix/salzburg-authentic-video-publish

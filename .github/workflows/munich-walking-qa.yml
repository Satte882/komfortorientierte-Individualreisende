name: Munich walking experience QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          npm install
          npm run build

      - name: Install browser client
        run: pip install selenium

      - name: Start static server
        run: |
          python3 -m http.server 4321 --directory dist >/tmp/server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4321/guides/munich-altstadt-walk/ >/dev/null

      - name: Validate walking experience
        run: |
          python3 - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          url = "http://127.0.0.1:4321/guides/munich-altstadt-walk/"
          stops = [
              ("odeonsplatz", "Odeonsplatz"),
              ("hofgarten", "Hofgarten"),
              ("max-joseph-platz", "Max-Joseph-Platz"),
              ("marienplatz", "Marienplatz"),
              ("viktualienmarkt", "Viktualienmarkt"),
              ("gaertnerplatz", "Gärtnerplatz"),
              ("deutsches-museum", "Deutsches Museum"),
          ]

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          driver = webdriver.Chrome(options=options)

          def open_page(width, height):
              driver.set_window_size(width, height)
              driver.get(url)
              driver.execute_script(
                  "localStorage.setItem('reiseauswahl-consent-v1', JSON.stringify({analytics:false,marketing:false}));"
              )
              driver.refresh()
              time.sleep(3)

          def wait_for_map():
              for _ in range(30):
                  if driver.find_elements("css selector", "[data-walking-map] .maplibregl-canvas"):
                      return
                  time.sleep(.3)
              raise AssertionError("MapLibre canvas missing")

          def step(stop_id):
              return driver.find_element("css selector", f'[data-walking-step="{stop_id}"]')

          def active_stop():
              return driver.find_element("css selector", "[data-walking-experience]").get_attribute("data-active-stop")

          def scroll_to(stop_id, pause=.9):
              el = step(stop_id)
              driver.execute_script("arguments[0].scrollIntoView({block:'center'});", el)
              time.sleep(pause)

          def marker_classes(index):
              return driver.find_element(
                  "css selector", f'[data-walking-marker="{index}"]'
              ).get_attribute("class")

          def all_markers_visible():
              return driver.execute_script("""
                  const map = document.querySelector('[data-walking-map]').getBoundingClientRect();
                  return [...document.querySelectorAll('[data-walking-marker]')].every((el) => {
                    const r = el.getBoundingClientRect();
                    const x = r.left + r.width / 2;
                    const y = r.top + r.height / 2;
                    return x >= map.left && x <= map.right && y >= map.top && y <= map.bottom;
                  });
              """)

          def marker_center(index):
              return driver.execute_script("""
                  const el = document.querySelector('[data-walking-marker="' + arguments[0] + '"]');
                  const r = el.getBoundingClientRect();
                  return {x:r.left+r.width/2,y:r.top+r.height/2};
              """, index)

          open_page(1440, 1100)
          wait_for_map()

          attribution = driver.find_element("css selector", ".maplibregl-ctrl-attrib").text
          if "OpenStreetMap" not in attribution or "OpenMapTiles" not in attribution:
              raise AssertionError(f"Attribution incomplete: {attribution!r}")

          previous_route_count = 0
          camera_positions = {}

          for index, (stop_id, title) in enumerate(stops):
              scroll_to(stop_id)
              if active_stop() != stop_id:
                  raise AssertionError(f"{stop_id}: active state is {active_stop()!r}")

              rendered_title = driver.find_element("css selector", "[data-stop-title]").text.strip()
              if rendered_title != title:
                  raise AssertionError(f"{stop_id}: title {rendered_title!r} != {title!r}")

              active_markers = driver.find_elements("css selector", ".walking-map-marker.is-active")
              if len(active_markers) != 1 or active_markers[0].get_attribute("data-walking-marker") != str(index):
                  raise AssertionError(f"{stop_id}: active marker mismatch")

              for earlier in range(index):
                  if "is-completed" not in marker_classes(earlier):
                      raise AssertionError(f"{stop_id}: marker {earlier} not completed")
              for later in range(index + 1, len(stops)):
                  if "is-future" not in marker_classes(later):
                      raise AssertionError(f"{stop_id}: marker {later} not future")

              route_count = int(driver.find_element(
                  "css selector", "[data-walking-map]"
              ).get_attribute("data-active-route-coordinate-count") or "0")
              if route_count < previous_route_count:
                  raise AssertionError(f"{stop_id}: route did not grow forward")
              previous_route_count = route_count

              if index in (0, 3, 6):
                  if not all_markers_visible():
                      raise AssertionError(f"{stop_id}: complete route context lost")
                  camera_positions[index] = marker_center(3)

          if previous_route_count < 100:
              raise AssertionError(f"Walking route geometry suspiciously short: {previous_route_count}")

          # Generic camera must visibly shift while keeping all stops in context.
          if abs(camera_positions[0]["x"] - camera_positions[6]["x"]) < 20 and abs(camera_positions[0]["y"] - camera_positions[6]["y"]) < 20:
              raise AssertionError(f"Camera focus barely moves: {camera_positions}")

          # Fast jump over several sections must resolve directly from DOM position.
          target = step("gaertnerplatz")
          driver.execute_script("window.scrollTo(0, arguments[0].offsetTop);", target)
          time.sleep(.35)
          if active_stop() != "gaertnerplatz":
              raise AssertionError(f"Fast forward jump resolved to {active_stop()!r}")

          # Backwards jump must shorten the active route and resolve the correct state.
          count_before_back = int(driver.find_element(
              "css selector", "[data-walking-map]"
          ).get_attribute("data-active-route-coordinate-count") or "0")
          target = step("hofgarten")
          driver.execute_script("window.scrollTo(0, arguments[0].offsetTop);", target)
          time.sleep(.4)
          if active_stop() != "hofgarten":
              raise AssertionError(f"Fast backward jump resolved to {active_stop()!r}")
          count_after_back = int(driver.find_element(
              "css selector", "[data-walking-map]"
          ).get_attribute("data-active-route-coordinate-count") or "0")
          if count_after_back >= count_before_back:
              raise AssertionError("Route did not shrink when scrolling backwards")

          # Resize must not lose the state.
          driver.set_window_size(1180, 900)
          time.sleep(.5)
          scroll_to("marienplatz")
          if active_stop() != "marienplatz":
              raise AssertionError("Resize broke state resolution")

          # Mobile portrait.
          open_page(390, 844)
          wait_for_map()
          stage = driver.find_element("css selector", ".walking-stage")
          if driver.execute_script("return getComputedStyle(arguments[0]).position", stage) != "sticky":
              raise AssertionError("Mobile stage is not sticky")
          height = stage.rect["height"]
          if height < 235 or height > 345:
              raise AssertionError(f"Mobile map height out of range: {height}")
          scroll_to("viktualienmarkt", .5)
          if active_stop() != "viktualienmarkt":
              raise AssertionError(f"Mobile state mismatch: {active_stop()!r}")
          if driver.execute_script("return document.documentElement.scrollWidth > document.documentElement.clientWidth + 1"):
              raise AssertionError("Mobile horizontal overflow")

          # Phone landscape remains in the mobile one-column/sticky pattern.
          driver.set_window_size(844, 390)
          time.sleep(.6)
          if driver.execute_script("return getComputedStyle(arguments[0]).position", stage) != "sticky":
              raise AssertionError("Phone landscape lost sticky map")
          if driver.execute_script("return document.documentElement.scrollWidth > document.documentElement.clientWidth + 1"):
              raise AssertionError("Phone landscape horizontal overflow")

          driver.quit()
          print("Munich walking experience QA passed")
          PY

name: Munich editorial walking QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          npm install
          npm run build

      - name: Install Selenium
        run: pip install selenium

      - name: Start site
        run: |
          python3 -m http.server 4321 --directory dist >/tmp/server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4321/guides/munich-altstadt-walk/ >/dev/null

      - name: Browser QA
        run: |
          python3 - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          url="http://127.0.0.1:4321/guides/munich-altstadt-walk/"
          ids=["odeonsplatz","hofgarten","max-joseph-platz","marienplatz","viktualienmarkt","gaertnerplatz","deutsches-museum"]

          options=Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          driver=webdriver.Chrome(options=options)

          def wait_js(script, timeout=15):
              end=time.time()+timeout
              while time.time()<end:
                  try:
                      if driver.execute_script(script):
                          return
                  except Exception:
                      pass
                  time.sleep(.2)
              raise AssertionError("timeout: "+script)

          def open_page(w,h):
              driver.set_window_size(w,h)
              driver.get(url)
              wait_js("return document.querySelectorAll('.walking-map-marker').length===7")
              wait_js("return Boolean(document.querySelector('[data-walking-map] .maplibregl-canvas'))")
              time.sleep(.7)

          def scroll_to(state_id):
              el=driver.find_element("css selector",f'[data-walking-step="{state_id}"]')
              driver.execute_script("arguments[0].scrollIntoView({block:'center'});",el)
              wait_js("return document.querySelector('[data-walking-experience]')?.getAttribute('data-active-stop')==="+repr(state_id))
              time.sleep(.75)

          def route_index():
              el=driver.find_element("css selector","[data-walking-map]")
              return int(el.get_attribute("data-active-route-index") or 0)

          open_page(1440,1200)

          page_text=driver.find_element("css selector","body").text
          forbidden=["Walking-Experience-Spike","GeoJSON","Browser-QA","Routing-Implementierung"]
          for word in forbidden:
              if word in page_text:
                  raise AssertionError("internal language leaked to public page: "+word)

          if "München Altstadt entspannt in 4 Stunden" not in page_text:
              raise AssertionError("new ICP-facing title missing")
          if "45–60 Minuten" not in page_text or "Sonntags ist der Markt geschlossen" not in page_text:
              raise AssertionError("practical ICP content missing")

          progress=[]
          for i,state_id in enumerate(ids):
              scroll_to(state_id)
              root=driver.find_element("css selector","[data-walking-experience]")
              if root.get_attribute("data-active-stop") != state_id:
                  raise AssertionError("wrong active stop "+state_id)
              markers=driver.find_elements("css selector",".walking-map-marker")
              classes=[m.get_attribute("class") or "" for m in markers]
              if sum("is-active" in x for x in classes)!=1:
                  raise AssertionError("active marker count invalid")
              if sum("is-completed" in x for x in classes)!=i:
                  raise AssertionError("completed marker count invalid at "+state_id)
              progress.append(route_index())

          if not all(progress[i] < progress[i+1] for i in range(len(progress)-1)):
              raise AssertionError("route progress not monotonic: "+str(progress))

          # Long-form content must still resolve fast jumps and backward scrolling.
          scroll_to("odeonsplatz")
          scroll_to("gaertnerplatz")
          if driver.find_element("css selector","[data-walking-experience]").get_attribute("data-active-stop")!="gaertnerplatz":
              raise AssertionError("fast jump failed")
          late=route_index()
          scroll_to("marienplatz")
          if route_index()>=late:
              raise AssertionError("backward route progress failed")

          # No runtime routing API.
          resources=driver.execute_script("return performance.getEntriesByType('resource').map(x=>x.name)")
          if any("routing.openstreetmap.de" in x or "brouter" in x.lower() for x in resources):
              raise AssertionError("runtime routing request detected")

          # Mobile: sticky map and no horizontal overflow.
          open_page(390,844)
          scroll_to("viktualienmarkt")
          stage=driver.find_element("css selector",".walking-stage")
          css=driver.execute_script("const s=getComputedStyle(arguments[0]),r=arguments[0].getBoundingClientRect();return {p:s.position,h:r.height};",stage)
          if css["p"]!="sticky" or not (239<=css["h"]<=341):
              raise AssertionError("mobile sticky map broken: "+str(css))
          overflow=driver.execute_script("return document.documentElement.scrollWidth > document.documentElement.clientWidth + 1")
          if overflow:
              raise AssertionError("mobile horizontal overflow")

          driver.quit()
          print("Munich editorial walking QA passed")
          PY

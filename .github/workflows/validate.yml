name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate production-safe build
        run: npm run check

      - name: Capture responsive screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p responsive-screenshots
          python3 -m http.server 4321 --directory dist >/tmp/reiseauswahl-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4321/ >/dev/null

          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"

          for width in 390 768 1440; do
            "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size="${width},1600" \
              --screenshot="responsive-screenshots/home-${width}.png" \
              http://127.0.0.1:4321/

            "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size="${width},1600" \
              --screenshot="responsive-screenshots/guide-paris-${width}.png" \
              http://127.0.0.1:4321/guides/paris-kunst-4-tage/

            "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size="${width},1600" \
              --screenshot="responsive-screenshots/decision-cordoba-${width}.png" \
              http://127.0.0.1:4321/decisions/cordoba-tagesausflug-oder-uebernachten/
          done

          test "$(find responsive-screenshots -type f -name '*.png' | wc -l)" -eq 9

      - name: Upload responsive screenshots
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots
          path: responsive-screenshots/
          if-no-files-found: error
          retention-days: 7

      - name: Build review-content preview
        env:
          PREVIEW_CONTENT: "true"
        run: npm run build

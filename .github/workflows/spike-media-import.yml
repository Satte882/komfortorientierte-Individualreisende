name: import paris spike media

on:
  push:
    branches: [feat/paris-immersive-spike]
    paths:
      - ".github/workflows/spike-media-import.yml"
      - "scripts/import-paris-spike-media.sh"

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/paris-immersive-spike
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: bash scripts/import-paris-spike-media.sh
      - name: Commit localized media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/paris-spike
          if git diff --cached --quiet; then
            echo "No media changes"
            exit 0
          fi
          git commit -m "chore: localize licensed Paris spike media"
          git push origin HEAD:feat/paris-immersive-spike

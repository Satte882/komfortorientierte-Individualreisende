name: Replace Munich hero with landscape summer media

on:
  push:
    branches:
      - fix/experience-hero-structure

permissions:
  contents: write

jobs:
  ingest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/experience-hero-structure
          fetch-depth: 0

      - name: Install media tooling
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check pillow

      - name: Download landscape Munich source
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            "https://videos.pexels.com/video-files/37252002/15781304_1920_1080_60fps.mp4" \
            -o /tmp/munich-landscape-source.mp4
          test -s /tmp/munich-landscape-source.mp4

      - name: Build web hero derivative
        shell: bash
        run: |
          ffmpeg -y -ss 1 -t 8 -i /tmp/munich-landscape-source.mp4 \
            -an \
            -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720" \
            -c:v libx264 -preset medium -crf 23 -pix_fmt yuv420p -movflags +faststart \
            public/videos/munich-altstadt-hero.mp4

          ffmpeg -y -ss 4 -i /tmp/munich-landscape-source.mp4 -frames:v 1 \
            -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720" \
            -c:v libwebp -quality 86 \
            public/images/munich-altstadt-hero-poster.webp

      - name: Validate media
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageStat
          image = Image.open("public/images/munich-altstadt-hero-poster.webp").convert("HSV")
          saturation = ImageStat.Stat(image).mean[1] / 255
          print(f"mean_saturation={saturation:.4f}")
          if saturation < 0.10:
              raise SystemExit("Hero poster is effectively monochrome; rejecting asset.")
          PY
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height \
            -of csv=s=x:p=0 public/videos/munich-altstadt-hero.mp4 | grep -qx "1280x720"

      - name: Commit replacement media
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/munich-altstadt-hero.mp4 public/images/munich-altstadt-hero-poster.webp
          git commit -m "feat: use landscape summer Munich hero media"
          git fetch origin fix/experience-hero-structure
          git rebase origin/fix/experience-hero-structure
          git push origin HEAD:fix/experience-hero-structure
